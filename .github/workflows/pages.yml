name: Deploy BeckCRM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Flutter
        env:
          FLUTTER_VERSION: 3.47.9
          FLUTTER_SHA256: 25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a
        run: |
          archive="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$archive" \
            --output "$RUNNER_TEMP/$archive"
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build web app
        run: flutter build web --release --base-href "/${GITHUB_REPOSITORY#*/}/" --no-web-resources-cdn
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
